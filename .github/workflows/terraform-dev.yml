name: Terraform Plan (dev)

on:
  pull_request:
    paths:
      - 'envs/dev/**'
      - 'modules/**'
      - '.github/workflows/terraform-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: '1.16.5'

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev
    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_github_repo: ${{ secrets.GCP_GITHUB_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required env vars
        run: |
          [ -n "$TF_VAR_project_id" ] || (echo "TF_VAR_project_id is empty" && exit 1)
          [ -n "$TF_VAR_github_repo" ] || (echo "TF_VAR_github_repo is empty" && exit 1)
          echo "TF_VAR_project_id = $TF_VAR_project_id"
          echo "TF_VAR_github_repo = $TF_VAR_github_repo"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SA }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=60s -out=tfplan 2>&1 | tee plan.txt
          terraform show -no-color tfplan > plan_rendered.txt

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('envs/dev/plan_rendered.txt', 'utf8');
            if (plan.length > 60000) {
              plan = plan.substring(0, 60000) + '\n\n... (truncated due to comment size limit)';
            }
            const body = [
              '#### Terraform Plan 📖',
              '',
              '```',
              plan,
              '```',
              '',
              `*Triggered by PR #${context.issue.number}*`
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });