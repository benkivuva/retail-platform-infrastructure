name: Test Workload Identity Federation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # REQUIRED for GitHub to issue the OIDC token

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Prove authentication works
        run: |
          echo "==> Current authenticated identity:"
          gcloud auth list
          echo ""
          echo "==> Project:"
          gcloud config get-value project
          echo ""
          echo "==> Listing service accounts (proves read access):"
          gcloud iam service-accounts list --limit=5